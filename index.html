<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kurikulum TRPL – Sistem Kurikulum OBE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <header class="appbar">
      <button
        id="toggle-sidebar"
        class="icon-btn"
        aria-label="Sembunyikan / Tampilkan Sidebar"
        title="Sembunyikan / Tampilkan Sidebar"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
        </svg>
      </button>
      <img
        class="logo"
        src="assets/logo.png"
        alt="Politeknik Astra"
      />
      <span class="sp"></span>
      <button
        id="btn-reset-db"
        class="btn-reset-db"
        type="button"
        title="Kembalikan semua data ke setelan awal (Reset Database)"
        aria-label="Reset Database"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Reset Data</span>
      </button>
      <div class="who">
        <div class="who-info">
          <span class="who-name">Pak Suhendra</span>
          <span class="who-role">Tim Kurikulum</span>
        </div>
        <span class="av">PS</span>
      </div>
    </header>
    <div class="app">
      <aside id="aside-nav"></aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
      <main>
        <div class="crumb" id="crumb"></div>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
        <div id="log-header-container"></div>
        <div class="paper">
          <div class="bar" id="bar">
            <div class="search">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                /></svg
              ><input
                id="q"
                type="search"
                placeholder="Cari kode atau nama..."
                aria-label="Cari"
              />
            </div>
            <select class="f" id="flt" aria-label="Filter" hidden></select>
            <button class="btn-log-shortcut" id="btn-master-log" style="display:none"></button>
            <button class="btn" id="add"></button>
          </div>
          <div id="view-container">
            <div class="scroll">
              <table>
                <thead id="th"></thead>
                <tbody id="tb"></tbody>
              </table>
            </div>
            <div id="empty"></div>
            <div class="foot" id="foot"></div>
          </div>
        </div>
      </main>
    </div>
    <div class="ov" id="ov" role="dialog" aria-modal="true">
      <div class="modal" id="modal"></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
